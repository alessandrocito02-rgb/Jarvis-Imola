    class SciFiSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.enabled) return null;
        if (!this.ctx && typeof window !== "undefined") {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      click(freq = 1320) {
        const ctx = this.init();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.045);

          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.055);
        } catch {}
      }

      protocol(isOverdrive = false) {
        const ctx = this.init();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const notes = isOverdrive ? [220, 277.18, 329.63, 440] : [587.33, 880, 1174.66];
          notes.forEach((f, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = isOverdrive ? "sawtooth" : "triangle";
            osc.frequency.setValueAtTime(f, now + idx * 0.045);

            gain.gain.setValueAtTime(isOverdrive ? 0.045 : 0.055, now + idx * 0.045);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + idx * 0.045 + 0.22);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.045);
            osc.stop(now + idx * 0.045 + 0.24);
          });
        } catch {}
      }

      radarPing() {
        const ctx = this.init();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(1760, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.28);

          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.32);
        } catch {}
      }

      shockwave() {
        const ctx = this.init();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.18);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.42);

          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        } catch {}
      }
    }

      voice.pulse = Math.max(0, voice.pulse - dt * 1.65);
      voice.protocolBoost = Math.max(0, voice.protocolBoost - dt * 0.65);

          Math.cos(t * 29) * 0.12 +
          Math.sin(t * 7.3) * 0.1
        : 0;
      const target = Math.min(
        1.35,
        baseIdle + speechMod + voice.pulse + voice.protocolBoost + (voice.overrideMode ? 0.35 : 0)
      );

      voice.level += (target - voice.level) * Math.min(1, dt * 10);
    }

    // 3D GEOMETRY & GLOW TEXTURE HELPERS FOR NEURAL SPHERE
    // ============================================================================
    const N_NODES = 520;
    const K_NEIGHBORS = 3;
    const CYAN_COLOR = new THREE.Color("#3ee8ff");
    const AMBER_COLOR = new THREE.Color("#ffb347");

    function buildNeuralSphereData() {
      const base = new Float32Array(N_NODES * 3);
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < N_NODES; i++) {
        const y = 1 - (i / (N_NODES - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const th = golden * i;
        base[i * 3] = Math.cos(th) * r;
        base[i * 3 + 1] = y;
        base[i * 3 + 2] = Math.sin(th) * r;
      }

      const pairs = [];
      const seen = new Set();
      for (let i = 0; i < N_NODES; i++) {
        const d = [];
        for (let j = 0; j < N_NODES; j++) {
          if (i === j) continue;
          const dx = base[i * 3] - base[j * 3];
          const dy = base[i * 3 + 1] - base[j * 3 + 1];
          const dz = base[i * 3 + 2] - base[j * 3 + 2];
          d.push([dx * dx + dy * dy + dz * dz, j]);
        }
        d.sort((a, b) => a[0] - b[0]);
        for (let k = 0; k < K_NEIGHBORS; k++) {
          const j = d[k][1];
          const key = i < j ? `${i}-${j}` : `${j}-${i}`;
          if (!seen.has(key)) {
            seen.add(key);
            pairs.push(i, j);
          }
        }
      }

      for (let s = 0; s < 70; s++) {
        pairs.push((Math.random() * N_NODES) | 0, (Math.random() * N_NODES) | 0);
      }

      const phase = new Float32Array(N_NODES);
      for (let i = 0; i < N_NODES; i++) {
        phase[i] = Math.random() * Math.PI * 2;
      }

      return { base, pairs: new Uint16Array(pairs), phase };
    }

    function createGlowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, "rgba(255, 255, 255, 1)");
      grad.addColorStop(0.25, "rgba(62, 232, 255, 0.85)");
      grad.addColorStop(0.6, "rgba(0, 180, 255, 0.25)");
      grad.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    // ============================================================================
    // THREE.JS WEBGL NEURAL SPHERE COMPONENT
    // ============================================================================
    function NeuralSphereCanvas({ onSphereTap }) {
      const mountRef = useRef(null);
      const tapCallbackRef = useRef(onSphereTap);

      useEffect(() => {
        tapCallbackRef.current = onSphereTap;
      }, [onSphereTap]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          45,
          container.clientWidth / Math.max(1, container.clientHeight),
          0.1,
          100
        );

        const updateCameraForViewport = (w, h) => {
          const aspect = w / Math.max(1, h);
          camera.aspect = aspect;
          const isMobileScreen = w < 768;
          if (aspect < 0.85) {
            camera.position.z = Math.min(11.8, Math.max(8.8, 6.1 / Math.max(0.48, aspect)));
            camera.position.y = -0.35;
          } else if (isMobileScreen) {
            camera.position.z = 8.4;
            camera.position.y = -0.15;
          } else {
            camera.position.z = 7.2;
            camera.position.y = 0;
          }
          camera.updateProjectionMatrix();
        };

        updateCameraForViewport(container.clientWidth, container.clientHeight);

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: "high-performance",
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.innerHTML = "";
        container.appendChild(renderer.domElement);

        const glowTex = createGlowTexture();
        const masterGroup = new THREE.Group();
        scene.add(masterGroup);

        const brainGroup = new THREE.Group();
        masterGroup.add(brainGroup);

        const { base, pairs, phase } = buildNeuralSphereData();
        const pos = new Float32Array(N_NODES * 3);
        const linePos = new Float32Array(pairs.length * 3);
        const lineCol = new Float32Array(pairs.length * 3);

        const ptsGeo = new THREE.BufferGeometry();
        ptsGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const ptsMat = new THREE.PointsMaterial({
          color: CYAN_COLOR,
          map: glowTex,
          size: 0.11,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.95,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const ptsMesh = new THREE.Points(ptsGeo, ptsMat);
        brainGroup.add(ptsMesh);

        const linesGeo = new THREE.BufferGeometry();
        linesGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3));
        linesGeo.setAttribute("color", new THREE.BufferAttribute(lineCol, 3));
        const linesMat = new THREE.LineBasicMaterial({
          vertexColors: true,
          transparent: true,
          opacity: 0.78,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const linesMesh = new THREE.LineSegments(linesGeo, linesMat);
        brainGroup.add(linesMesh);

        const icoGeo = new THREE.IcosahedronGeometry(1, 2);
        const icoMat = new THREE.MeshBasicMaterial({
          color: CYAN_COLOR,
          wireframe: true,
          transparent: true,
          opacity: 0.45,
          blending: THREE.AdditiveBlending,
        });
        const coreMesh = new THREE.Mesh(icoGeo, icoMat);
        brainGroup.add(coreMesh);

        const innerSphereGeo = new THREE.SphereGeometry(0.26, 32, 32);
        const innerSphereMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color("#e0ffff"),
          transparent: true,
          opacity: 0.95,
        });
        const innerSphere = new THREE.Mesh(innerSphereGeo, innerSphereMat);
        brainGroup.add(innerSphere);

        const spriteMat = new THREE.SpriteMaterial({
          map: glowTex,
          color: CYAN_COLOR,
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const coreHalo = new THREE.Sprite(spriteMat);
        coreHalo.scale.set(2.4, 2.4, 1);
        brainGroup.add(coreHalo);

        const shockGeo = new THREE.RingGeometry(0.3, 0.42, 64);
        const shockMat = new THREE.MeshBasicMaterial({
          color: AMBER_COLOR,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const shockRing = new THREE.Mesh(shockGeo, shockMat);
        scene.add(shockRing);

        const ringConfigs = [
          { r: 2.3, tilt: [1.3, 0, 0.2], speed: 0.3, col: CYAN_COLOR, arc: Math.PI * 1.6, tube: 0.013 },
          { r: 2.55, tilt: [0.4, 0.6, 0], speed: -0.22, col: AMBER_COLOR, arc: Math.PI * 0.95, tube: 0.015 },
          { r: 2.8, tilt: [1.8, 0.3, 0.5], speed: 0.15, col: CYAN_COLOR, arc: Math.PI * 2, tube: 0.006 },
          { r: 3.1, tilt: [Math.PI / 2, 0, 0], speed: -0.12, col: CYAN_COLOR, arc: Math.PI * 1.25, tube: 0.012 },

          const mesh = new THREE.Mesh(tGeo, tMat);
          pivot.add(mesh);
          ringsGroup.add(pivot);
          ringMeshes.push({ mesh, cfg, mat: tMat });

        const dustCount = 1500;
        const dustArr = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustArr.length; i++) {

        const dustMat = new THREE.PointsMaterial({
          color: "#2a8fb0",

        const dustPoints = new THREE.Points(dustGeo, dustMat);
        scene.add(dustPoints);

        const interaction = {
          pointerX: 0,
          pointerY: 0,
          targetPointerX: 0,
          targetPointerY: 0,
          isDragging: false,
          dragStartX: 0,
          dragStartY: 0,

        const onPointerDown = (clientX, clientY) => {
          interaction.isDragging = true;
          interaction.dragStartX = clientX;
          interaction.dragStartY = clientY;
          interaction.lastX = clientX;
          interaction.lastY = clientY;

        const onPointerMoveCoords = (clientX, clientY) => {
          const rect = container.getBoundingClientRect();
          if (rect.width && rect.height) {
            interaction.targetPointerX = ((clientX - rect.left) / rect.width) * 2 - 1;
            interaction.targetPointerY = -(((clientY - rect.top) / rect.height) * 2 - 1);
          }
          if (interaction.isDragging) {
            const dx = clientX - interaction.lastX;
            const dy = clientY - interaction.lastY;
            interaction.lastX = clientX;
            interaction.lastY = clientY;
            interaction.velY = dx * 0.0075;
            interaction.velX = dy * 0.0065;
            interaction.userRotY += interaction.velY;
            interaction.userRotX = Math.max(-1.1, Math.min(1.1, interaction.userRotX + interaction.velX));
          }
        };

        const onPointerUp = (clientX, clientY) => {
          if (!interaction.isDragging) return;
          interaction.isDragging = false;
          const moveDist = Math.hypot(
            clientX - interaction.dragStartX,
            clientY - interaction.dragStartY
          );
          const elapsed = performance.now() - interaction.downTime;
          if (moveDist < 12 && elapsed < 350) {
            voice.pulse = 0.95;
            voice.shockwaveTime = 1.0;
            sfx.shockwave();
            if (tapCallbackRef.current) tapCallbackRef.current();
          }
        };

        const handleMouseDown = (e) => onPointerDown(e.clientX, e.clientY);
        const handleMouseMove = (e) => onPointerMoveCoords(e.clientX, e.clientY);
        const handleMouseUp = (e) => onPointerUp(e.clientX, e.clientY);

        const handleTouchStart = (e) => {
          if (e.touches.length === 1) {
            const t = e.touches[0];
            onPointerDown(t.clientX, t.clientY);
          }
        };
        const handleTouchMove = (e) => {
          if (e.touches.length === 1) {
            const t = e.touches[0];
            onPointerMoveCoords(t.clientX, t.clientY);
          }
        };
        const handleTouchEnd = (e) => {
          const t = e.changedTouches[0];
          if (t) onPointerUp(t.clientX, t.clientY);
          else interaction.isDragging = false;
        };

        const domElem = renderer.domElement;
        domElem.addEventListener("mousedown", handleMouseDown);
        window.addEventListener("mousemove", handleMouseMove);
        window.addEventListener("mouseup", handleMouseUp);
        domElem.addEventListener("touchstart", handleTouchStart, { passive: true });
        domElem.addEventListener("touchmove", handleTouchMove, { passive: true });
        domElem.addEventListener("touchend", handleTouchEnd, { passive: true });

        const onResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          if (w === 0 || h === 0) return;
          updateCameraForViewport(w, h);
          renderer.setSize(w, h);
        };
        window.addEventListener("resize", onResize);
        const resizeObs = new ResizeObserver(onResize);
        resizeObs.observe(container);

        let frameId;
        let spin = 0;
        let prevTime = performance.now() * 0.001;
        const tempColor = new THREE.Color();

        const animate = () => {
          const now = performance.now() * 0.001;
          const dt = Math.min(now - prevTime, 0.05);
          prevTime = now;
          const t = now;

          tickVoice(dt, t);
          const L = voice.level;

          interaction.pointerX += (interaction.targetPointerX - interaction.pointerX) * 0.06;
          interaction.pointerY += (interaction.targetPointerY - interaction.pointerY) * 0.06;

          if (!interaction.isDragging) {
            interaction.userRotY += interaction.velY;
            interaction.userRotX = Math.max(-1.1, Math.min(1.1, interaction.userRotX + interaction.velX));
            interaction.velY *= 0.94;
            interaction.velX *= 0.94;
          }

          spin += dt * (0.14 + L * 1.45);
          brainGroup.rotation.y = spin + interaction.pointerX * 0.35 + interaction.userRotY;
          brainGroup.rotation.x =
            0.25 + Math.sin(t * 0.25) * 0.08 - interaction.pointerY * 0.25 + interaction.userRotX;

          ringsGroup.rotation.y = interaction.userRotY * 0.65 + interaction.pointerX * 0.15;
          ringsGroup.rotation.x = interaction.userRotX * 0.65 - interaction.pointerY * 0.15;

          for (let i = 0; i < N_NODES; i++) {
            const bx = base[i * 3];
            const by = base[i * 3 + 1];
            const bz = base[i * 3 + 2];
            const wave = Math.sin(by * 6 + t * 5 + phase[i]) * Math.cos(bx * 5 - t * 3);
            const r = 1.62 * (1 + wave * L * 0.24 + Math.sin(t + phase[i]) * 0.014);
            pos[i * 3] = bx * r;
            pos[i * 3 + 1] = by * r;
            pos[i * 3 + 2] = bz * r;
          }
          ptsGeo.attributes.position.needsUpdate = true;

          const overrideFactor = voice.overrideMode ? 0.55 : 0;
          for (let p = 0; p < pairs.length; p++) {
            const i = pairs[p];
            linePos[p * 3] = pos[i * 3];
            linePos[p * 3 + 1] = pos[i * 3 + 1];
            linePos[p * 3 + 2] = pos[i * 3 + 2];

            const fire =
              Math.pow(Math.max(0, Math.sin(t * 4.2 + phase[i] * 3)), 8) * (L * 2.2) +
              overrideFactor;
            tempColor
              .copy(CYAN_COLOR)
              .lerp(AMBER_COLOR, Math.min(1, fire))
              .multiplyScalar(0.38 + L * 0.95 + fire * 0.8);

            lineCol[p * 3] = tempColor.r;
            lineCol[p * 3 + 1] = tempColor.g;
            lineCol[p * 3 + 2] = tempColor.b;
          }
          linesGeo.attributes.position.needsUpdate = true;
          linesGeo.attributes.color.needsUpdate = true;

          const coreScale = 0.44 + L * 0.36 + Math.sin(t * 2.2) * 0.025;
          coreMesh.scale.setScalar(coreScale);
          coreMesh.rotation.y -= dt * (0.55 + L * 3.2);
          coreMesh.rotation.z += dt * 0.32;
          icoMat.color.copy(voice.overrideMode ? AMBER_COLOR : CYAN_COLOR);

          const haloScale = 2.1 + L * 1.4 + Math.sin(t * 4) * 0.12;
          coreHalo.scale.set(haloScale, haloScale, 1);
          spriteMat.color.copy(voice.overrideMode ? AMBER_COLOR : CYAN_COLOR);

          if (voice.shockwaveTime > 0.01) {
            const prog = 1 - voice.shockwaveTime;
            const sScale = 1 + prog * 8.5;
            shockRing.scale.setScalar(sScale);
            shockMat.opacity = voice.shockwaveTime * 0.75;
            shockMat.color.copy(voice.overrideMode ? AMBER_COLOR : CYAN_COLOR);
          } else {
            shockMat.opacity = 0;
          }

          ringMeshes.forEach(({ mesh, cfg }) => {
            mesh.rotation.z += dt * cfg.speed * (1 + L * 6.2);
          });

          dustPoints.rotation.y += dt * (0.012 + L * 0.08);

          renderer.render(scene, camera);
          frameId = requestAnimationFrame(animate);
        };

        frameId = requestAnimationFrame(animate);

        return () => {
          cancelAnimationFrame(frameId);
          domElem.removeEventListener("mousedown", handleMouseDown);
          window.removeEventListener("mousemove", handleMouseMove);
          window.removeEventListener("mouseup", handleMouseUp);
          domElem.removeEventListener("touchstart", handleTouchStart);
          domElem.removeEventListener("touchmove", handleTouchMove);
          domElem.removeEventListener("touchend", handleTouchEnd);
          window.removeEventListener("resize", onResize);
          resizeObs.disconnect();
          renderer.dispose();
        };
      }, []);

      return (
        <div
          ref={mountRef}
          className="fixed lg:absolute inset-0 w-full h-full z-10 cursor-grab active:cursor-grabbing"
          style={{
            filter: "drop-shadow(0 0 18px rgba(0, 243, 255, 0.35))",
            touchAction: "none",
          }}
        />
      );
    }

    // UI SUB-COMPONENTS

    function AnimatedGraph({ color = "#00f3ff", height = 26, speed = 1.2, active = false }) {
      const pathRef = useRef(null);

      useEffect(() => {
        let frame;
        let offset = 0;
        const ptsCount = 26;
        const points = Array.from(
          { length: ptsCount },
          () => Math.random() * height * 0.75 + height * 0.12
        );

        const animate = () => {
          const mult = active ? 1.85 : 1;
          offset += speed * mult * 0.45;
          if (offset >= 10) {
            offset = 0;
            points.shift();
            const boost = voice.level * height * 0.35;
            points.push(
              Math.min(
                height - 2,
                Math.max(3, Math.random() * height * 0.7 + height * 0.12 + boost)
              )
            );
          }

          if (pathRef.current) {
            const d = points
              .map((y, i) => `${i === 0 ? "M" : "L"} ${(i * 10 - offset).toFixed(1)} ${(height - y).toFixed(1)}`)
              .join(" ");
            pathRef.current.setAttribute("d", d);
          }
          frame = requestAnimationFrame(animate);
        };

        frame = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(frame);
      }, [height, speed, active]);

      return (
        <svg
          width="100%"
          height={height}
          viewBox={`0 0 230 ${height}`}
          preserveAspectRatio="none"
          className="overflow-hidden opacity-90 block"
        >
          <path
            ref={pathRef}
            fill="none"
            stroke={color}
            strokeWidth="1.5"
            style={{ filter: `drop-shadow(0 0 3px ${color})` }}
          />
        </svg>
      );
    }

            <span className="flex items-center gap-1.5 font-semibold">

            </span>
            {code && <span className="text-cyan-300/60 text-[9px]">{code}</span>}
          </header>

        </section>

              <span className="text-[8px] text-cyan-300/70">{unit}</span>
            </span>

          <span className="mt-0.5 font-mono text-[9px] uppercase tracking-widest text-cyan-300/70">

    function ItalianClock() {
      const [d, setD] = useState(() => new Date());
      useEffect(() => {
        const i = setInterval(() => setD(new Date()), 1000);
        return () => clearInterval(i);
      }, []);
      return (
        <span>
          {d.toLocaleTimeString("it-IT")} ·{" "}
          {d.toLocaleDateString("it-IT", {
            weekday: "short",

            year: "numeric",
          })}

    // ============================================================================
    // MAIN UNIFIED APPLICATION
    // ============================================================================
    function App() {
      const [active, setActive] = useState(false);
      const [speaking, setSpeaking] = useState(false);
      const [muted, setMuted] = useState(false);
      const [sfxEnabled, setSfxEnabled] = useState(true);
      const [activeProtocol, setActiveProtocol] = useState(null);
      const [mobileTab, setMobileTab] = useState("CORE");
      const [selectedTarget, setSelectedTarget] = useState(RADAR_TARGETS[0]);
      const [customCmd, setCustomCmd] = useState("");
      const [briefingList, setBriefingList] = useState(DEFAULT_BRIEFING);
      const [newsFeed, setNewsFeed] = useState(DEFAULT_NEWS);
      const [subtitle, setSubtitle] = useState(
        "Sistema in standby. Premi ATTIVA J.A.R.V.I.S. per ascoltare la Rassegna Stampa con voce ElevenLabs."
      );
      const [typedSubtitle, setTypedSubtitle] = useState("");
      const [agents, setAgents] = useState(INITIAL_AGENTS);
      const [rightTab, setRightTab] = useState("ALL");
      const [eventLog, setEventLog] = useState([
        { time: "SYS.INIT", text: "NEURAL: 520 nodi sinaptici online.", isAlert: false, url: "" },
        { time: "SYS.SYNC", text: "Connessione a briefing.json e ElevenLabs pronta.", isAlert: false, url: "" },
      ]);

      const runIdRef = useRef(0);
      const typewriterRef = useRef(null);
      const audioPlayerRef = useRef(new Audio());

      const [telemetry, setTelemetry] = useState(() => ({
        cpu: 24,
        gpu: 32,
        ram: 46,
        vram: 62,
        net: 94,
        temp: 42,
        power: 34,
        cores: Array.from({ length: 16 }, () => 25),
        wave: Array.from({ length: 48 }, () => 0.08),
        hex: "0x88FFA2",
      }));

      // Carica automaticamente briefing.json generato da Python all'avvio
      useEffect(() => {
        fetch("briefing.json?t=" + new Date().getTime())
          .then((res) => (res.ok ? res.json() : null))
          .then((data) => {
            if (Array.isArray(data) && data.length > 0) {
              const formatted = data.map((item, idx) => ({
                testo: item.testo || String(item),
                url: item.url || "",
                audio: item.audio || `audio/audio_${idx}.mp3`,
              }));
              setBriefingList(formatted);
              setNewsFeed(formatted.map((f) => f.testo));
            }
          })
          .catch(() => {});
      }, []);

      const activeAgentsCount = useMemo(
        () => agents.filter((a) => a.active).length,
        [agents]
      );

      const cognitiveSegments = useMemo(() => {
        const base = Math.round((activeAgentsCount / agents.length) * 12);
        const dynamic = active ? (speaking ? 6 : 3) : 0;
        const ovr = activeProtocol === "OVR" ? 4 : 0;
        return Math.min(20, Math.max(2, base + dynamic + ovr));
      }, [activeAgentsCount, agents.length, active, speaking, activeProtocol]);

      useEffect(() => {
        const interval = setInterval(
          () => {
            const L = voice.level;
            const m = active || speaking ? 1 : 0.38;
            const ovrBoost = activeProtocol === "OVR" ? 22 : 0;

            setTelemetry((p) => {
              const drift = (v, lo, hi) =>
                Math.max(
                  4,
                  Math.min(
                    99,
                    v + (lo + (hi - lo) * m + ovrBoost + rnd(-11, 11) * m - v) * 0.32
                  )
                );
              return {
                cpu: drift(p.cpu, 18, 86),
                gpu: drift(p.gpu, 24, 95),
                ram: drift(p.ram, 42, 76),
                vram: drift(p.vram, 38, 88),
                net: drift(p.net, 72, 99),
                temp: drift(p.temp, 39, 76),
                power: drift(p.power, 28, 94),
                cores: p.cores.map((c) => drift(c, 8, 96)),
                wave: [
                  ...p.wave.slice(1),
                  Math.min(1, L * rnd(0.65, 1.45) + (speaking ? 0.18 : 0.04)),
                ],
                hex:
                  "0x" +
                  Math.floor(Math.random() * 0xffffff)
                    .toString(16)
                    .toUpperCase()
                    .padStart(6, "0"),
              };
            });
          },
          active || speaking ? 100 : 450
        );
        return () => clearInterval(interval);
      }, [active, speaking, activeProtocol]);

      useEffect(() => {
        if (typewriterRef.current) clearInterval(typewriterRef.current);
        let idx = 0;
        setTypedSubtitle("");
        typewriterRef.current = setInterval(() => {
          idx++;
          setTypedSubtitle(subtitle.slice(0, idx));
          if (idx >= subtitle.length) {
            clearInterval(typewriterRef.current);
          }
        }, 16);
        return () => {
          if (typewriterRef.current) clearInterval(typewriterRef.current);
        };
      }, [subtitle]);

      useEffect(() => {
        return () => {
          window.speechSynthesis?.cancel();
          audioPlayerRef.current.pause();
        };
      }, []);

      const pushLog = useCallback((text, isAlert = false, url = "") => {
        const now = new Date().toLocaleTimeString("it-IT");
        setEventLog((prev) => [{ time: now, text, isAlert, url }, ...prev.slice(0, 34)]);
      }, []);

      // Sintesi vocale del browser (usata per i pulsanti rapidi o come fallback)
      const speakItalian = useCallback(
        (text) =>
          new Promise((resolve) => {
            const synth = typeof window !== "undefined" ? window.speechSynthesis : null;
            const estDuration = Math.min(4200, 1100 + text.length * 36);

            const fallbackPulseTimer = setInterval(() => {
              voice.pulse = Math.max(voice.pulse, 0.36);
            }, 170);

            let settled = false;
            const finish = () => {
              if (!settled) {
                settled = true;
                clearInterval(fallbackPulseTimer);
                resolve();
              }
            };

            if (!synth || muted) {
              setTimeout(finish, estDuration);
              return;
            }

            try {
              synth.cancel();
              const u = new SpeechSynthesisUtterance(text);
              u.lang = "it-IT";
              u.rate = 1.04;
              u.pitch = 0.86;
              const voices = synth.getVoices();
              const itVoice =
                voices.find((v) => v.lang.startsWith("it") && v.name.toLowerCase().includes("google")) ||
                voices.find((v) => v.lang.startsWith("it"));
              if (itVoice) u.voice = itVoice;

              u.onboundary = () => {
                voice.pulse = 0.45;
              };
              u.onend = finish;
              u.onerror = finish;

              synth.speak(u);
              setTimeout(finish, estDuration + 1200);
            } catch {
              setTimeout(finish, estDuration);
            }
          }),
        [muted]
      );

      // Riproduce i file MP3 di ElevenLabs generati da Python (con fallback a speakItalian)
      const playElevenLabsOrSpeak = useCallback(
        (testo, fileAudio) =>
          new Promise((resolve) => {
            if (muted) {
              setTimeout(resolve, 1500);
              return;
            }
            if (!fileAudio) {
              speakItalian(testo).then(resolve);
              return;
            }

            const player = audioPlayerRef.current;
            player.pause();
            player.src = fileAudio + "?t=" + new Date().getTime();

            const pulseTimer = setInterval(() => {
              voice.pulse = Math.max(voice.pulse, 0.48);
            }, 140);

            const cleanup = () => {
              clearInterval(pulseTimer);
              player.onended = null;
              player.onerror = null;
            };

            player.onended = () => {
              cleanup();
              resolve();
            };

            player.onerror = () => {
              cleanup();
              speakItalian(testo).then(resolve);
            };

            player.play().catch(() => {
              cleanup();
              speakItalian(testo).then(resolve);
            });
          }),
        [muted, speakItalian]
      );

      const triggerSingleResponse = useCallback(
        async (speechText, logText, isAlert = false, boost = 0.5) => {
          const id = ++runIdRef.current;
          window.speechSynthesis?.cancel();
          audioPlayerRef.current.pause();

          voice.active = true;
          voice.speaking = true;
          voice.protocolBoost = boost;
          setActive(true);
          setSpeaking(true);
          setSubtitle(speechText);
          if (logText) pushLog(logText, isAlert);

          await speakItalian(speechText);

          if (runIdRef.current !== id) return;
          voice.speaking = false;
          setSpeaking(false);
        },
        [pushLog, speakItalian]
      );

      const handleSphereTap = useCallback(() => {
        pushLog("IMPULSO SINAPTICO: Onda d'urto neurale generata manualmente.", false);
        if (!speaking) {
          setSubtitle("Impulso sinaptico ricevuto. Risonanza armonica dei 520 nodi al 100%.");
        }
      }, [pushLog, speaking]);

      // Avvia la Rassegna Stampa dal file briefing.json + voce ElevenLabs
      const toggleBriefing = async () => {
        sfx.protocol(false);
        const id = ++runIdRef.current;
        if (active && speaking) {
          window.speechSynthesis?.cancel();
          audioPlayerRef.current.pause();
          voice.active = false;
          voice.speaking = false;
          voice.overrideMode = false;
          setActive(false);
          setSpeaking(false);
          setActiveProtocol(null);
          setSubtitle("Trasmissione interrotta. J.A.R.V.I.S. in modalità standby.");
          pushLog("SISTEMA: Sequenza briefing interrotta dall'utente.", false);
          return;
        }

        voice.active = true;
        setActive(true);
        pushLog("BRIEFING: Scaricamento rassegna stampa e audio ElevenLabs...", false);
        window.speechSynthesis?.cancel();
        audioPlayerRef.current.pause();

        let items = briefingList;
        try {
          const res = await fetch("briefing.json?t=" + new Date().getTime());
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              items = data.map((item, idx) => ({
                testo: item.testo || String(item),
                url: item.url || "",
                audio: item.audio || `audio/audio_${idx}.mp3`,
              }));
              setBriefingList(items);
              setNewsFeed(items.map((f) => f.testo));
            }
          }
        } catch (e) {
          console.error("Errore fetch briefing.json:", e);
        }

        for (let i = 0; i < items.length; i++) {
          if (runIdRef.current !== id) return;
          const { testo, url, audio } = items[i];
          setSubtitle(testo);
          voice.speaking = true;
          setSpeaking(true);

          await playElevenLabsOrSpeak(testo, audio);
          if (runIdRef.current !== id) return;

          voice.speaking = false;
          setSpeaking(false);
          pushLog(`RASSEGNA › ${testo}`, false, url);
          await new Promise((r) => setTimeout(r, 350));
        }

        if (runIdRef.current === id) {
          setSubtitle("Rassegna stampa completata. Clicca sulle notizie nel Registro a destra per aprire gli articoli.");
        }
      };

      const handleProtocolClick = (code) => {
        const proto = PROTOCOLS[code];
        if (!proto) return;

        const isTogglingOffOvr = code === "OVR" && activeProtocol === "OVR";
        if (isTogglingOffOvr) {
          sfx.click(880);
          voice.overrideMode = false;
          setActiveProtocol(null);
          triggerSingleResponse(
            "Override disattivato. Parametri sinaptici riportati al livello nominale.",
            "PROTOCOLLO OVR: Ritorno alla modalità operativa standard.",
            false,
            0.3
          );
          return;
        }

        if (code === "SCAN") sfx.radarPing();
        else sfx.protocol(code === "OVR");

        setActiveProtocol(code);
        voice.overrideMode = code === "OVR";
        triggerSingleResponse(
          proto.speech,
          proto.log,
          code === "OVR" || code === "SEC",
          proto.boost
        );
      };

      const handleToggleAgent = (agentId) => {
        sfx.click(1480);
        setAgents((prev) =>

                    <div className="text-[#00f3ff] font-bold">520 NODI FIBONACCI · 3D WEBGL</div>
                    <div className="flex items-center gap-1 text-cyan-200/80">
                      <Touchpad className="w-2.5 h-2.5 text-[#00f3ff]" />
                      <span>TRASCINA PER RUOTARE · TOCCA PER IMPULSO</span>
                    </div>
                  </div>

                  <div className="text-right space-y-0.5 bg-[#05090f]/45 px-2 py-1 border-r border-[#ffb347]/50">
                    <div className="text-[#ffb347] font-bold">
                      ARK: {(3.1 + telemetry.power * 0.004).toFixed(2)} GJ/s
                    </div>
                    <div>
                      PROTOCOLLO: <span className="text-white font-bold">{activeProtocol || "NOMINALE"}</span>
                    </div>
                  </div>
                </div>
              </div>

              {mobileTab !== "CORE" && (
                <div className="lg:hidden pointer-events-auto flex-1 overflow-y-auto space-y-2.5 pr-0.5 pb-2">
                  {mobileTab === "SISTEMA" && renderSystemTelemetryPanels()}
                  {mobileTab === "AGENTI" && renderAgentsPanel("flex flex-col")}
                  {mobileTab === "RADAR" && renderRadarAndLogsPanels()}
                </div>
              )}

              {/* BOTTOM CONSOLE */}
              <div
                className={`pointer-events-auto mx-auto w-full max-w-2xl flex flex-col items-center gap-1.5 pt-1 shrink-0 ${
                  mobileTab !== "CORE" ? "hidden lg:flex" : "flex"
                }`}
              >
                <div className="hud-panel w-full text-center">
                  <div className="min-h-[2.4rem] flex items-center justify-center px-1">
                    <p className="font-display-jarvis text-xs sm:text-base font-medium leading-snug text-white text-glow">
                      {typedSubtitle}
                      <span className="inline-block ml-1 text-[#00f3ff] animate-pulse">_</span>
                    </p>
                  </div>

                  <div className="my-1.5 flex h-6 sm:h-7 items-center justify-center gap-[2px] px-2">
                    {telemetry.wave.map((w, i) => {
                      const isAmber = activeProtocol === "OVR" || w > 0.78;
                      return (
                        <div
                          key={i}
                          className={`w-1 transition-all duration-75 ${
                            isAmber
                              ? "bg-[#ffb347] shadow-[0_0_6px_#ff8c00]"
                              : "bg-[#00f3ff] shadow-[0_0_6px_#00f3ff]"
                          }`}
                          style={{ height: `${Math.max(12, Math.min(100, 8 + w * 92))}%` }}
                        />
                      );
                    })}
                  </div>

                  <div className="flex flex-col sm:flex-row items-center justify-between gap-2 pt-1.5 border-t border-cyan-500/20">
                    <button
                      onClick={toggleBriefing}
                      className={`hud-button w-full sm:w-auto flex items-center justify-center gap-2 ${
                        active && speaking ? "hud-button-active" : ""
                      }`}
                    >
                      {active && speaking ? (
                        <>
                          <Square className="w-3.5 h-3.5 fill-current" />
                          <span>Interrompi</span>
                        </>
                      ) : (
                        <>
                          <Play className="w-3.5 h-3.5 fill-current" />
                          <span>Attiva J.A.R.V.I.S.</span>
                        </>
                      )}
                    </button>

                    <div className="flex flex-wrap justify-center gap-1 sm:gap-1.5 w-full sm:w-auto">
                      {Object.keys(PROTOCOLS).map((code) => {
                        const isSelected = activeProtocol === code;
                        const isOvr = code === "OVR";
                        return (
                          <button
                            key={code}
                            onClick={() => handleProtocolClick(code)}
                            className={`px-2.5 py-1 rounded-full border text-[9px] sm:text-[10px] font-bold tracking-wider transition-all cursor-pointer ${
                              isSelected
                                ? isOvr
                                  ? "border-[#ff8c00] bg-[#ff8c00] text-black"
                                  : "border-[#00f3ff] bg-[#00f3ff] text-black"
                                : "border-cyan-500/40 bg-cyan-950/40 text-cyan-300 hover:bg-[#00f3ff] hover:text-black"
                            }`}
                          >
                            {code}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="mt-2 pt-1.5 border-t border-cyan-500/15 flex flex-col gap-1.5">
                    <form onSubmit={handleCommandSubmit} className="flex gap-1.5">
                      <input
                        type="text"
                        value={customCmd}
                        onChange={(e) => setCustomCmd(e.target.value)}
                        placeholder="Invia direttiva o scrivi 'notizie' per avviare la rassegna..."
                        className="flex-1 bg-[#03070c]/80 border border-cyan-500/35 px-2.5 py-1 text-[10px] sm:text-xs text-white placeholder-cyan-500/50 focus:outline-none focus:border-[#00f3ff]"
                      />
                      <button
                        type="submit"
                        className="px-3 py-1 bg-cyan-500/20 border border-[#00f3ff] text-[#00f3ff] hover:bg-[#00f3ff] hover:text-black transition-colors text-[10px] font-bold flex items-center gap-1 cursor-pointer"
                      >
                        <Send className="w-3 h-3" />
                        <span className="hidden sm:inline">INVIA</span>
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </section>

            <aside className="hidden lg:flex flex-col gap-2.5 min-h-0 overflow-y-auto pl-0.5 pointer-events-auto">
              {renderRadarAndLogsPanels()}
            </aside>
          </div>

          {/* MOBILE BOTTOM NAVIGATION DOCK */}
          <nav className="lg:hidden relative z-30 grid grid-cols-4 gap-1 px-2 py-1.5 border-t border-cyan-500/30 bg-[#05090f]/95 backdrop-blur-md shrink-0">
            {[
              { id: "CORE", label: "CORE 3D", icon: Sparkles, badge: activeProtocol || "LIVE" },
              { id: "SISTEMA", label: "SISTEMA", icon: Activity, badge: `${Math.round(telemetry.cpu)}%` },
              { id: "AGENTI", label: "AGENTI", icon: Layers, badge: `${activeAgentsCount}/7` },
              { id: "RADAR", label: "NOTIZIE & LOG", icon: Compass, badge: `${eventLog.length}` },
            ].map((tab) => {
              const IconComp = tab.icon;
              const isCurrent = mobileTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => handleMobileTabChange(tab.id)}
                  className={`flex flex-col items-center justify-center py-1 px-1 border transition-all cursor-pointer ${
                    isCurrent
                      ? "border-[#00f3ff] bg-cyan-950/70 text-white"
                      : "border-cyan-500/20 bg-black/40 text-cyan-400/70"
                  }`}
                >
                  <div className="flex items-center gap-1">
                    <IconComp className={`w-3.5 h-3.5 ${isCurrent ? "text-[#00f3ff]" : ""}`} />
                    <span className="text-[7px] px-1 bg-cyan-500/15 text-[#00f3ff] border border-cyan-500/30">
                      {tab.badge}
                    </span>
                  </div>
                  <span className="text-[9px] font-bold tracking-wider mt-0.5">{tab.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
