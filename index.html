<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Daily Briefing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font futuristici -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #02040a;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-blue);
            font-family: 'Rajdhani', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0,243,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,243,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }
        .text-glow { text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); }

        /* --- HUD Rings --- */
        .hud-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .ring-1 {
            width: 80vmin; height: 80vmin;
            border: 2px solid rgba(0, 243, 255, 0.1);
            border-top: 4px solid var(--neon-blue);
            border-left: 2px solid rgba(0, 243, 255, 0.5);
            animation: spin 12s linear infinite;
        }

        .ring-2 {
            width: 72vmin; height: 72vmin;
            border: 2px dashed var(--neon-blue);
            opacity: 0.5;
            animation: spin-reverse 18s linear infinite;
        }

        .ring-3 {
            width: 60vmin; height: 60vmin;
            border: 4px solid transparent;
            border-bottom: 4px solid var(--neon-blue);
            border-right: 4px solid rgba(0, 243, 255, 0.8);
            animation: spin 8s ease-in-out infinite alternate;
        }
        
        .ring-4 {
            width: 45vmin; height: 45vmin;
            border: 2px dotted rgba(0, 243, 255, 0.4);
            animation: spin-reverse 25s linear infinite;
        }

        .is-speaking .ring-1 { animation: spin 4s linear infinite; }
        .is-speaking .ring-2 { animation: spin-reverse 6s linear infinite; }
        .is-speaking .ring-3 { animation: spin 3s ease-in-out infinite alternate; }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }

        /* Central Overlay & Button */
        .center-content {
            position: absolute;
            z-index: 10;
            text-align: center;
            width: 70vmin;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .jarvis-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 15px 30px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 15px var(--neon-blue) inset, 0 0 20px var(--neon-blue);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .jarvis-btn:hover {
            background: var(--neon-blue);
            color: var(--dark-bg);
            box-shadow: 0 0 30px var(--neon-blue) inset, 0 0 40px var(--neon-blue);
            transform: scale(1.05);
        }

        .active-text {
            font-size: 1.6rem;
            line-height: 1.3;
            font-weight: 600;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.5s ease;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px var(--neon-blue);
            background: rgba(2, 4, 10, 0.7);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .active-text.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Archive Section */
        .archive-section {
            height: 30vh;
            width: 100%;
            background: linear-gradient(to top, rgba(0, 243, 255, 0.05), transparent);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }

        .archive-item {
            font-family: monospace;
            font-size: 0.95rem;
            color: rgba(0, 243, 255, 0.7);
            border-left: 2px solid var(--neon-blue);
            padding-left: 10px;
            background: rgba(0, 243, 255, 0.05);
            padding: 10px;
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        .hud-header {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <header class="hud-header">
        <div class="orbitron text-2xl md:text-3xl font-bold text-glow tracking-widest">J.A.R.V.I.S.</div>
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_10px_#00f3ff]"></div>
            <span class="text-xs md:text-sm tracking-widest text-cyan-400/80 font-mono">SYS.ONLINE</span>
        </div>
    </header>

    <div class="hud-container" id="hud-core">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="ring ring-4"></div>

        <div class="center-content">
            <button id="start-btn" class="jarvis-btn orbitron font-bold">
                Avvia Protocollo
            </button>
            <div id="active-display" class="active-text hidden">
                Inizializzazione sistemi...
            </div>
        </div>
    </div>

    <div class="archive-section" id="archive-log">
        <div class="text-cyan-500/40 font-mono text-xs text-center mb-2">/// ARCHIVIO SESSIONE ///</div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        const activeDisplay = document.getElementById('active-display');
        const archiveLog = document.getElementById('archive-log');
        const hudCore = document.getElementById('hud-core');

        startBtn.addEventListener('click', async () => {
            if (!('speechSynthesis' in window)) {
                alert("Sintesi vocale non supportata in questo browser.");
                return;
            }

            startBtn.classList.add('hidden');
            activeDisplay.classList.remove('hidden');
            hudCore.classList.add('is-speaking');
            
            archiveLog.innerHTML = '<div class="text-cyan-500/40 font-mono text-xs text-center mb-2">/// ARCHIVIO SESSIONE ///</div>';
            window.speechSynthesis.cancel();

            let frasi = [];
            try {
                const response = await fetch('briefing.json?t=' + new Date().getTime());
                if (response.ok) {
                    frasi = await response.json();
                } else {
                    frasi = [{ testo: "Attenzione Signore, file di briefing non ancora disponibile sui server.", url: "" }];
                }
            } catch (error) {
                console.error("Errore di rete:", error);
                frasi = [{ testo: "Errore di connessione al sistema di briefing.", url: "" }];
            }

            // ECCO IL NUOVO CICLO FOR INSERITO AL POSTO DEL VECCHIO
            for (let i = 0; i < frasi.length; i++) {
                let testoNotizia = frasi[i].testo || frasi[i]; 
                let urlNotizia = frasi[i].url || "";
                
                if (typeof testoNotizia === "string" && testoNotizia.trim() !== "") {
                    await parlaFrase(testoNotizia, urlNotizia);
                    await new Promise(resolve => setTimeout(resolve, 400));
                }
            }

            activeDisplay.classList.remove('show');
            setTimeout(() => {
                activeDisplay.classList.add('hidden');
                startBtn.classList.remove('hidden');
                hudCore.classList.remove('is-speaking');
            }, 500);
        });

        function parlaFrase(testo, url) {
            return new Promise((resolve) => {
                activeDisplay.textContent = testo;
                activeDisplay.classList.add('show');

                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = 'it-IT';
                utterance.rate = 1.0;
                utterance.pitch = 0.9;

                const voices = window.speechSynthesis.getVoices();
                const italianVoice = voices.find(v => v.lang.startsWith('it') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('google')));
                if (italianVoice) utterance.voice = italianVoice;

                utterance.onend = () => {
                    archiveNews(testo, url);
                    activeDisplay.classList.remove('show');
                    resolve();
                };

                utterance.onerror = () => {
                    archiveNews("Errore voce: " + testo, "");
                    activeDisplay.classList.remove('show');
                    resolve();
                };

                window.speechSynthesis.speak(utterance);
            });
        }

        function archiveNews(text, url) {
            const logItem = document.createElement('div');
            logItem.className = 'archive-item';
            
            if (url) {
                logItem.innerHTML = `> <a href="${url}" target="_blank" style="text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: inherit;">${text}</a>`;
            } else {
                logItem.textContent = "> " + text;
            }
            
            archiveLog.insertBefore(logItem, archiveLog.children[1]);
            archiveLog.scrollTop = 0;
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    });
    </script>
</body>
</html>
