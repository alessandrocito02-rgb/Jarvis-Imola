name: Jarvis Notizie Mondo

on:
  workflow_dispatch:

# Aggiungiamo i permessi di scrittura
permissions:
  contents: write

jobs:
  notiziario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-genai feedparser requests gtts
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC_MONDO: ${{ secrets.NTFY_TOPIC_MONDO }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python jarvis_mondo.py
        
      # Nuovo blocco: salva il file JSON su GitHub per farglielo leggere all'HUD
      - name: Salva i dati per l'interfaccia web
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase || echo "Nessun conflitto"
          git add briefing.json
          git commit -m "Aggiornamento automatico briefing.json [skip ci]" || echo "Nessuna modifica"
          git push origin main
