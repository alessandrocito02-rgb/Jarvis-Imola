name: Jarvis Notizie Mondo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notiziario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # MODIFICA QUI: Rimosso gtts e aggiunto edge-tts
      - run: pip install google-genai feedparser requests edge-tts
      
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC_MONDO: ${{ secrets.NTFY_TOPIC_MONDO }}
          # Puoi anche rimuovere ELEVENLABS_API_KEY dai secrets se non la usi altrove
        run: python jarvis_mondo.py
        
      - name: Salva i dati e gli MP3 per l'interfaccia web
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add briefing.json audio/
          git commit -m "Aggiornamento automatico briefing e voce Edge TTS" || echo "Nessuna modifica"
          git pull origin main --rebase || echo "Nessun conflitto"
          git push origin main
