name: Jarvis F1 Imola Monitor

on:
#  schedule:
#    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Esegui Jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python jarvis_imola.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'Jarvis Bot'
          git config --global user.email 'bot@example.com' # (o l'email che usi per il bot)
          git add .
          git commit -m "Aggiorna memoria notizie" || echo "No changes to commit"
          
          # AGGIUNGI QUESTA RIGA PER RISOLVERE IL CONFLITTO:
          git pull --rebase origin main
          
          # LASCIA IL PUSH COME ULTIMO COMANDO:
          git push
