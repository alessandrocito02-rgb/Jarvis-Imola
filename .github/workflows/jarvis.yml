name: Jarvis F1 Imola Monitor

on:
#  schedule:
#    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install google-genai feedparser requests

      - name: Esegui Jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python jarvis_imola.py

      - name: Salva memoria notizie lette
        run: |
          git config --global user.name 'Jarvis Bot'
          git config --global user.email 'jarvis@bot.local'
          git add seen_articles.json || true
          git diff --staged --quiet || git commit -m "Aggiorna memoria notizie"
          git push
